name: Auto Guide Publisher

on:
  # [2026-06-17 비활성화] AdSense "가치가 낮은 콘텐츠" 판정 대응.
  # 자동 생성 글 누적이 사이트 정체성을 "AI 정보 블로그"로 흐리는 1순위 원인으로 판단,
  # 정기 자동발행을 중단한다. 재개하려면 아래 schedule 블록 주석을 해제할 것.
  # schedule:
  #   - cron: "0 0 * * 1"   # 주 1회(월 09:00 KST)

  # 수동 실행 (검수 후 의도적으로 1편씩 발행할 때만 사용)
  workflow_dispatch:
    inputs:
      count:
        description: "생성할 가이드 수"
        required: false
        default: "1"
      dry_run:
        description: "미리보기만 (저장 안 함)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Random delay (0~10분, 수동 실행 시 생략)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 11 ))
          echo "⏱ ${DELAY}분 대기 후 실행 (KST 9:0${DELAY})"
          sleep $(( DELAY * 60 ))

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline
        working-directory: tesla-quote-app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GUIDES_PER_RUN: ${{ github.event.inputs.count || '1' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m scripts.main --dry-run
          else
            python -m scripts.main
          fi

      # Supabase 발행 시 guides.js는 변경 없음 → 커밋 불필요
      # 파일 발행 fallback 시에만 커밋
      - name: Commit & push if guides.js changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesla-quote-app/lib/guides.js
          if git diff --cached --quiet; then
            echo "guides.js 변경 없음 (Supabase 발행됨 또는 dry-run)"
          else
            git commit -m "auto: 가이드 자동 발행 $(date +'%Y-%m-%d')"
            git push
          fi
