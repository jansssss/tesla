name: Auto Guide Publisher

on:
  # 정기 판단은 로컬 paytesla AI 운영체제가 3일마다 GSC를 읽고 수행한다.
  # 이 워크플로는 장애 시 한 편만 수동 생성하는 복구 수단으로 유지한다.
  workflow_dispatch:
    inputs:
      count:
        description: "한 실행당 최대 1편으로 제한됩니다"
        required: false
        default: "1"
      dry_run:
        description: "미리보기만 (저장 안 함)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: paytesla-static-content
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tesla-quote-app/package-lock.json

      - name: Install dependencies
        working-directory: tesla-quote-app
        run: |
          python -m pip install -r scripts/requirements.txt
          npm ci

      - name: Run pipeline
        working-directory: tesla-quote-app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GUIDES_PER_RUN: "1"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m scripts.main --dry-run
          else
            python -m scripts.main --file --count 1
          fi

      - name: Verify content and build
        if: github.event.inputs.dry_run != 'true'
        working-directory: tesla-quote-app
        run: |
          npm run content:audit
          npm test
          npm run build

      - name: Commit and push static guide
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesla-quote-app/lib/guides.js
          if git diff --cached --quiet; then
            echo "정적 가이드 변경 없음"
          else
            git commit -m "content: publish reviewed static guide $(date +'%Y-%m-%d')"
            git push
          fi
