name: Auto Guide Publisher

on:
  # 대량 생성을 피하고 월 1편만 추가한다. GSC 검색어와 기존 제목을 먼저 비교하고,
  # 공식 출처·본문 분량·표·체크리스트·내부링크 게이트를 모두 통과해야 커밋한다.
  schedule:
    - cron: "0 1 1 * *"   # 매월 1일 10:00 KST

  # 수동 실행 (검수 후 의도적으로 1편씩 발행할 때만 사용)
  workflow_dispatch:
    inputs:
      count:
        description: "한 실행당 최대 1편으로 제한됩니다"
        required: false
        default: "1"
      dry_run:
        description: "미리보기만 (저장 안 함)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: paytesla-static-content
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tesla-quote-app/package-lock.json

      - name: Install dependencies
        working-directory: tesla-quote-app
        run: |
          python -m pip install -r scripts/requirements.txt
          npm ci

      - name: Run pipeline
        working-directory: tesla-quote-app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GUIDES_PER_RUN: "1"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m scripts.main --dry-run
          else
            python -m scripts.main --file --count 1
          fi

      - name: Verify content and build
        if: github.event.inputs.dry_run != 'true'
        working-directory: tesla-quote-app
        run: |
          npm run content:audit
          npm test
          npm run build

      - name: Commit and push static guide
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesla-quote-app/lib/guides.js
          if git diff --cached --quiet; then
            echo "정적 가이드 변경 없음"
          else
            git commit -m "content: publish reviewed static guide $(date +'%Y-%m-%d')"
            git push
          fi
